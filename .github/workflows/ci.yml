name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend - testy
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend - testy i build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    name: Test integracyjny na prawdziwej bazie MySQL
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: sklep_ci
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - run: npm run init-db
        working-directory: backend
      - name: Uruchom API i sprawdź endpointy
        working-directory: backend
        run: |
          node src/server.js &
          sleep 3
          curl -sf http://localhost:3000/api/health
          test "$(curl -sf http://localhost:3000/api/bikes | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).length))')" -ge 36
          npm run test:load

  # Wdrożenie: SnapDeploy ma włączone "Auto Deploy on Push" dla gałęzi main,
  # więc po pushu platforma sama buduje obraz z Dockerfile i wdraża aplikację.
  # Poniższy job sprawdza tylko, czy wdrożona aplikacja odpowiada (nie blokuje CI).
  smoke:
    name: Test dymny wdrożonej aplikacji
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    steps:
      - name: Poczekaj na wdrożenie i sprawdź /api/health
        run: |
          sleep 120
          curl -sf --retry 6 --retry-delay 20 --retry-all-errors https://veloshop-7a008.containers.snapdeploy.app/api/health
